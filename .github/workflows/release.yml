name: Release

# Publishes `clacky` to npm when a GitHub release is published.
#
# Authentication uses npm trusted publishing (OIDC): no token is stored in the repo.
# One-time setup on npmjs.com: package "clacky" → Settings → Trusted publishing →
# GitHub Actions → repository Rishabjs03/keyboard-graph, workflow "release.yml".
# (A classic NPM_TOKEN secret also works as a fallback.)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing + provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Pinned to 11: npm 12 requires a
      # newer Node 22 patch release than runners may have.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint && pnpm build:lib && pnpm typecheck && pnpm test && pnpm --filter clacky smoke

      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(node -p "require('./packages/clacky/package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" && exit 1
          fi

      - name: Publish
        working-directory: packages/clacky
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
