name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build library
        run: pnpm build:lib

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Packaging smoke test (ESM + CJS + SSR)
        run: pnpm --filter keyboard-graph smoke

      - name: Build demo
        run: pnpm --filter demo build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Bundle size
        run: pnpm --filter keyboard-graph size
